service: flashmail-serverless

frameworkVersion: "3"

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - "@aws-sdk/*" # provided by the Lambda Node20 runtime

  # SES inbound-receiving region — no default, so an un-set deploy fails loudly.
  region: ${param:region}

  # true: no active rule set exists yet, this stack creates one (needs a one-time
  # manual `aws ses set-active-receipt-rule-set` after first deploy).
  # false: adds our rule to an already-active set (existingRuleSetName below).
  createRuleSet: ${param:createRuleSet, 'true'}
  existingRuleSetName: ${param:existingRuleSetName, ''}

  # No Recipients condition on the ReceiptRule below — a bare-domain condition only
  # matches that exact domain, not subdomains (confirmed via live test), so omitting
  # it is what makes every generated username@<hash>.vaibhav.rs address work.

provider:
  name: aws
  runtime: nodejs20.x
  region: ${self:custom.region}
  stage: ${opt:stage, 'prod'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 30
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt SmtpReceiverDLQ.Arn

functions:
  smtpReceiver:
    handler: src/handlers/smtpReceiver.handler
    description: SES-in-SNS -> parse MIME -> upsert into Supabase emails table
    environment:
      SUPABASE_URL: ${env:SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${ssm:/flashmail/${self:provider.stage}/supabase-service-role-key}
      NEXT_PUBLIC_DOMAIN: ${env:NEXT_PUBLIC_DOMAIN, 'flash-mail.vaibhav.rs'}
    events:
      - sns:
          arn: !Ref SesInboundTopic
          topicName: flashmail-ses-inbound
    destinations:
      onFailure:
        type: sqs
        arn: !GetAtt SmtpReceiverDLQ.Arn

  cleaner:
    handler: src/handlers/cleaner.handler
    description: Purge of expired rows from the Supabase emails table, every 5 minutes
    environment:
      SUPABASE_URL: ${env:SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${ssm:/flashmail/${self:provider.stage}/supabase-service-role-key}
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true

resources:
  Conditions:
    ShouldCreateRuleSet: !Equals ["${self:custom.createRuleSet}", "true"]

  Resources:
    SesInboundTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: flashmail-ses-inbound

    SesInboundTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref SesInboundTopic
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowSESPublish
              Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action: sns:Publish
              Resource: !Ref SesInboundTopic
              Condition:
                StringEquals:
                  AWS:SourceAccount: !Ref AWS::AccountId

    SmtpReceiverDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: flashmail-smtp-receiver-dlq
        MessageRetentionPeriod: 1209600 # 14 days

    FlashmailRuleSet:
      Type: AWS::SES::ReceiptRuleSet
      Condition: ShouldCreateRuleSet
      Properties:
        RuleSetName: flashmail-rule-set

    FlashmailReceiptRule:
      Type: AWS::SES::ReceiptRule
      DependsOn:
        - SesInboundTopicPolicy
      Properties:
        RuleSetName: !If
          - ShouldCreateRuleSet
          - !Ref FlashmailRuleSet
          - ${self:custom.existingRuleSetName}
        Rule:
          Name: flashmail-inbound
          Enabled: true
          ScanEnabled: true
          Actions:
            - SNSAction:
                TopicArn: !Ref SesInboundTopic
                Encoding: Base64

  Outputs:
    SesInboundTopicArn:
      Value: !Ref SesInboundTopic
    SmtpReceiverDLQUrl:
      Value: !Ref SmtpReceiverDLQ
    SmtpReceiverDLQArn:
      Value: !GetAtt SmtpReceiverDLQ.Arn
